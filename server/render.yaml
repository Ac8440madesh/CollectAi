services:
  - type: web
    name: collectai-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODE
        value: live
      - key: LLM_API_KEY
        sync: false
      - key: ENABLE_CRON_JOBS
        value: "true"
      - key: CRON_SECRET
        sync: false
